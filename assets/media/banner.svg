<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Fondo -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Carrusel principal -->
  <rect x="200" y="100" width="800" height="200" rx="20" fill="url(#card)" filter="url(#shadow)"/>
  
  <!-- Tarjetas de productos -->
  <rect x="250" y="130" width="120" height="140" rx="12" fill="#ffd700" opacity="0.9"/>
  <rect x="400" y="130" width="120" height="140" rx="12" fill="#ff6b35" opacity="0.9"/>
  <rect x="550" y="130" width="120" height="140" rx="12" fill="#2c3e50" opacity="0.9"/>
  <rect x="700" y="130" width="120" height="140" rx="12" fill="#27ae60" opacity="0.9"/>
  <rect x="850" y="130" width="120" height="140" rx="12" fill="#e74c3c" opacity="0.9"/>
  
  <!-- Flechas de navegación -->
  <polygon points="180,200 220,180 220,220" fill="#ffffff" opacity="0.9"/>
  <polygon points="1020,200 980,180 980,220" fill="#ffffff" opacity="0.9"/>
  
  <!-- Puntos de paginación -->
  <circle cx="500" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="550" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="600" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="650" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="700" cy="320" r="4" fill="#ffffff" opacity="0.6"/>
  
  <!-- Título principal -->
  <text x="600" y="80" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffffff">NGSI Woo Carousel</text>
  
  <!-- Subtítulo -->
  <text x="600" y="110" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff" opacity="0.9">Carrusel de productos WooCommerce con interfaz visual</text>
  
  <!-- Características -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#ffffff" opacity="0.8">✅ Shortcode • ✅ Interfaz Visual • ✅ Personalización • ✅ DIVI Compatible</text>
  
  <!-- Autor -->
  <text x="600" y="385" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#ffd700" opacity="0.8">por Nelson Gil Olguín</text>
</svg>
