<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  
  <!-- Carrusel base -->
  <rect x="20" y="40" width="88" height="48" rx="8" fill="url(#card)" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Tarjetas de productos -->
  <rect x="28" y="48" width="16" height="32" rx="4" fill="#ffd700" opacity="0.8"/>
  <rect x="48" y="48" width="16" height="32" rx="4" fill="#ff6b35" opacity="0.8"/>
  <rect x="68" y="48" width="16" height="32" rx="4" fill="#2c3e50" opacity="0.8"/>
  <rect x="88" y="48" width="16" height="32" rx="4" fill="#27ae60" opacity="0.8"/>
  
  <!-- Flechas de navegación -->
  <polygon points="15,56 25,52 25,60" fill="#ffffff" opacity="0.9"/>
  <polygon points="113,56 103,52 103,60" fill="#ffffff" opacity="0.9"/>
  
  <!-- Puntos de paginación -->
  <circle cx="50" cy="92" r="2" fill="#667eea" opacity="0.6"/>
  <circle cx="64" cy="92" r="2" fill="#667eea" opacity="0.6"/>
  <circle cx="78" cy="92" r="2" fill="#667eea" opacity="0.6"/>
  
  <!-- Texto NGSI -->
  <text x="64" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">NGSI</text>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#ffffff" opacity="0.8">Woo Carousel</text>
</svg>
